type: json
# Solr 10 removed the JMX metrics reporter; metrics come from /admin/metrics in Prometheus text format.
# Every Solr 10 config uses the same url, so one response is fetched per interval and shared.
data:
  url: /solr/admin/metrics?wt=prometheus&name=solr_core_indexsearcher_cache_lookups,solr_core_indexsearcher_cache_size,solr_core_indexsearcher_cache_ops,solr_core_field_cache_entries,solr_core_field_cache_size_bytes,solr_core_indexsearcher_index_docs,solr_core_indexsearcher_index_num_docs,solr_core_segments,solr_core_indexsearcher_open_warmup_time_milliseconds,solr_core_index_size_megabytes,solr_core_indexwriter_merges,solr_core_indexwriter_merge_docs,solr_core_update_log_size_remaining_bytes,solr_core_update_log_replay_logs_remaining,solr_core_update_log_replay_ops,solr_core_update_log_old_updates_copied,solr_core_update_log_buffered_ops,solr_core_update_log_applied_buffered_ops,solr_core_update_log_state,solr_core_update_commit_ops,solr_core_update_maintenance_ops,solr_core_update_cumulative_ops,solr_core_update_errors,solr_core_update_auto_commits,solr_core_update_docs_pending_commit,solr_core_update_commit_stats,solr_core_requests,solr_core_requests_times_milliseconds,solr_core_requests_errors,solr_core_requests_timeout
  server: ${ST_MONITOR_SOLR_NODE_HOSTPORT}
  basicHttpAuthUsername: ${ST_MONITOR_SOLR_NODE_BASICAUTH_USERNAME}
  basicHttpAuthPassword: ${ST_MONITOR_SOLR_NODE_BASICAUTH_PASSWORD}
  jsonHandlerClass: com.sematext.spm.client.solr.SolrPrometheusJsonHandler
require:
  - className: com.sematext.spm.client.solr.SolrVersionCheck
    values: 10-*
  - className: com.sematext.spm.client.solr.SolrModeCheck
    values: std

observation:

  - name: searcher_maxDoc_solr10_classic
    metricNamespace: solr
    path: $.solr_core_indexsearcher_index_docs[?(@.core=${core})]

    metric:
      - name: index.docs.max
        source: value
        type: long_gauge
        label: index max doc
        description: max doc in the index
        unit: docs

    tag:
      - name: solr.core
        value: ${core}

      - name: solr.collection
        value: ${core}


  - name: searcher_numDocs_solr10_classic
    metricNamespace: solr
    path: $.solr_core_indexsearcher_index_num_docs[?(@.core=${core})]

    metric:
      - name: index.docs
        source: value
        type: long_gauge
        label: index num docs
        description: number of docs in the index
        unit: docs

    tag:
      - name: solr.core
        value: ${core}

      - name: solr.collection
        value: ${core}


  - name: searcher_segments_solr10_classic
    metricNamespace: solr
    path: $.solr_core_segments[?(@.core=${core})]

    metric:
      - name: index.segments
        source: value
        type: gauge
        label: index segments
        description: index segments count

    tag:
      - name: solr.core
        value: ${core}

      - name: solr.collection
        value: ${core}


  - name: searcher_warmupTime_solr10_classic
    metricNamespace: solr
    path: $.solr_core_indexsearcher_open_warmup_time_milliseconds_sum[?(@.core=${core})]

    metric:
      - name: warmup.time
        source: value
        type: counter
        label: warmup time
        description: warmup time
        unit: ms

    tag:
      - name: solr.core
        value: ${core}

      - name: solr.collection
        value: ${core}

      - name: solr.warmup.type
        value: searcher


  - name: index_size_solr10_classic
    metricNamespace: solr
    path: $.solr_core_index_size_megabytes[?(@.core=${core})]

    metric:
      - name: sizeMb
        source: value
        type: double_gauge
        send: false

      - name: index.files.size
        source: func:DoubleMultiplyWithConstant(sizeMb,1048576)
        type: gauge
        label: index size on the disk
        description: size of solr index on the disk
        unit: bytes

    tag:
      - name: solr.core
        value: ${core}

      - name: solr.collection
        value: ${core}
