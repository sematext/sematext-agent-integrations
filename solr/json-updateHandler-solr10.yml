        source: value
        type: gauge
        label: autocommit max time
        description: autocommit max time
        unit: ms

    tag:
      - name: solr.core
        value: ${core}

      - name: solr.collection
        value: ${core}

      - name: solr.update.handler
        value: updateHandler
